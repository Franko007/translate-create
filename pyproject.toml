[project]
name = "vibeathon-builder-agents"
version = "0.1.0"
description = "Multi-agent system (ADK + A2A) that GENERATES the Nerdearla vibeathon MVP (live simultaneous transcription)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ADK 2.x + A2A 1.x. Techos deliberados por la misma razon que el repo de
    # referencia: versiones mas nuevas rompen imports (vertexai.types,
    # a2a.server.apps, a2a.types.TransportProtocol). Ver docs/GOTCHAS.md.
    "google-cloud-aiplatform[agent_engines]>=1.121.0,<2",
    "google-adk>=1.25.0,<2",
    "a2a-sdk>=0.3.9,<1",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "google-auth>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]